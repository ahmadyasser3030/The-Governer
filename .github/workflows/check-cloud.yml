name: Check the supplied public cloud connection
on:
  push:
    branches: [governor-preview]
    paths: [.github/workflows/check-cloud.yml, connect.js]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public configuration without signing in or reading personal records
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const code = fs.readFileSync('connect.js', 'utf8');
            const url = code.match(/url:'(https:\/\/[a-z0-9-]+\.supabase\.co)'/)?.[1];
            const key = code.match(/key:'(sb_publishable_[^']+)'/)?.[1];
            if (!url || !key) throw new Error('A valid public configuration was not found.');
            const headers = {apikey:key};
            const result = {checkedAt:new Date().toISOString(),projectUrl:url,cloudConnected:false};
            try {
              const auth = await fetch(`${url}/auth/v1/settings`, {headers,signal:AbortSignal.timeout(15000)});
              result.authStatus = auth.status;
              const settings = await auth.json();
              result.publicKeyAccepted = auth.ok;
              result.newSignupsDisabled = settings.disable_signup ?? null;
              result.emailLoginEnabled = settings.external?.email ?? null;
              // limit=0 checks permission/schema only and cannot return user records.
              const table = await fetch(`${url}/rest/v1/governor_data?select=user_id&limit=0`, {headers,signal:AbortSignal.timeout(15000)});
              result.tableStatus = table.status;
              const body = await table.json();
              result.tableErrorCode = Array.isArray(body) ? null : body?.code || null;
              result.tableMissing = body?.code === 'PGRST205';
              result.anonymousSelectDenied = !table.ok && body?.code === '42501';
              result.note = 'Read-only public checks. No authentication session, personal data, SQL changes, or live device sync were performed.';
            } catch (error) { result.error = error.message; }
            const site = 'https://ahmadyasser3030.github.io/The-Governer/';
            for (let attempt=0; attempt<12; attempt++) {
              try {
                const checks = await Promise.all(['connect.html','connect.js','setup.sql'].map(async path=>{
                  const response = await fetch(new URL(path,site),{signal:AbortSignal.timeout(10000)});
                  const body = await response.text();
                  return response.ok && (path==='connect.html' ? body.includes('Connect this device') : path==='connect.js' ? body.includes(key) : body.includes('create table if not exists public.governor_data'));
                }));
                if (checks.every(Boolean)) { result.setupPageReady=true;result.setupPageUrl=new URL('connect.html',site).href;break; }
              } catch {}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            result.setupPageReady = result.setupPageReady || false;
            const {owner, repo} = context.repo;
            const branch = 'governor-publish-status', path = 'governor-cloud-check.json';
            let sha;
            try { sha = (await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha; }
            catch(error) { if(error.status!==404)throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:'Record public cloud setup checks',content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),...(sha?{sha}:{})});
