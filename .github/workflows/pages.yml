name: Publish approved Governor app
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: governor-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - name: Package only public app files
        run: |
          mkdir -p site/docs
          cp index.html style.css app.js core.js cloud.js migration.js sw.js icon.svg icon-192.png icon-512.png manifest.webmanifest site/
          cp docs/guide.html docs/cloud-setup.html site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
