name: Inspect Governor publication status
on:
  push:
    branches: [governor-preview]
    paths: [.github/workflows/inspect-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const {owner,repo}=context.repo;
            for(let sample=0;sample<3;sample++){
            const result={checkedAt:new Date().toISOString(),sourceCommit:context.sha};
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({owner,repo,branch:'governor-preview',per_page:12})).data.workflow_runs;
            result.runs=[];
            for(const run of runs){
              const item={name:run.name,sha:run.head_sha,status:run.status,conclusion:run.conclusion,url:run.html_url};
              if(run.conclusion==='failure'||(run.status==='in_progress'&&run.name==='Check the live Governor website')){
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:run.id})).data.jobs;
                item.jobs=jobs.map(j=>({name:j.name,conclusion:j.conclusion,steps:j.steps.map(s=>({name:s.name,status:s.status,startedAt:s.started_at,conclusion:s.conclusion}))}));
              }
              result.runs.push(item);
            }
            try{const site=(await github.rest.repos.getPages({owner,repo})).data;result.pages={status:site.status,url:site.html_url,source:site.source};}catch(e){result.pagesError=e.message;}
            try{
              const url='https://ahmadyasser3030.github.io/The-Governer/';
              const response=await fetch(url);const html=await response.text();
              const app=await fetch(new URL('app.js',url));const code=await app.text();
              result.site={status:response.status,gold:html.includes('THE GOVERNOR'),appMatchesSource:code===fs.readFileSync('app.js','utf8'),appSha256:crypto.createHash('sha256').update(code).digest('hex')};
              const release=(await github.rest.repos.getReleaseByTag({owner,repo,tag:'governor-v2.0.0-gold'})).data;
              result.release={url:release.html_url,assets:release.assets.map(a=>({name:a.name,bytes:a.size,url:a.browser_download_url}))};
            }catch(e){result.checkError=e.message;}
            const branch='governor-publish-status',path='governor-publication-diagnostics.json';
            for(let attempt=0;attempt<5;attempt++){
              try{
                let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
                await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:'Record Governor publication diagnosis',content:Buffer.from(JSON.stringify(result,null,2)+'\n').toString('base64'),...(sha?{sha}:{})});
                break;
              }catch(e){if(attempt===4||![409,422].includes(e.status))throw e;await new Promise(resolve=>setTimeout(resolve,1000));}
            }

            if(sample<2)await new Promise(resolve=>setTimeout(resolve,20000));
            }
