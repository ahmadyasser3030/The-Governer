name: Put the Governor online
on:
  push:
    branches: [governor-preview]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: governor-first-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Check free hosting and preserve any existing website
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const repository = (await github.rest.repos.get({owner, repo})).data;
            if (repository.private) {
              core.setOutput('blocked_reason', 'private-repository');
              core.setFailed('Stopped: free GitHub Pages normally requires a public repository. No privacy or billing settings were changed.');
              return;
            }
            try {
              const existing = (await github.rest.repos.getPages({owner, repo})).data;
              core.setOutput('blocked_reason', 'existing-website');
              core.setOutput('existing_url', existing.html_url || '');
              core.setFailed('Stopped: an existing GitHub Pages website was found. It has not been replaced.');
            } catch (error) {
              if (error.status !== 404) {
                core.setOutput('blocked_reason', `github-access-${error.status || 'unknown'}`);
                throw error;
              }
              core.setOutput('eligible', 'true');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - name: Package public app assets
        run: |
          mkdir -p site/docs
          cp index.html style.css app.js core.js cloud.js migration.js sw.js icon.svg icon-192.png icon-512.png manifest.webmanifest site/
          cp docs/guide.html docs/cloud-setup.html site/docs/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check published website
        id: livecheck
        if: steps.deployment.outcome == 'success'
        env:
          GOVERNOR_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.GOVERNOR_SITE_URL;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const htmlResponse = await fetch(base);
              const html = await htmlResponse.text();
              const appResponse = await fetch(new URL('app.js', base));
              if (htmlResponse.ok && appResponse.ok && html.includes('The Governor') && html.includes('id="main"')) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Publication succeeded but website readiness could not be confirmed.');
          JS
      - name: Save deployment outcome for the connected workspace
        if: always()
        uses: actions/github-script@v7
        env:
          GOVERNOR_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          GOVERNOR_DEPLOYMENT: ${{ steps.deployment.outcome }}
          GOVERNOR_LIVECHECK: ${{ steps.livecheck.outcome }}
          GOVERNOR_ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          GOVERNOR_BLOCKED: ${{ steps.eligibility.outputs.blocked_reason }}
          GOVERNOR_EXISTING_URL: ${{ steps.eligibility.outputs.existing_url }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = 'governor-publish-status';
            const ref = `heads/${branch}`;
            try { await github.rest.git.getRef({owner, repo, ref}); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/${ref}`, sha: context.sha});
            }
            const path = 'governor-publication.json';
            let sha;
            try { sha = (await github.rest.repos.getContent({owner, repo, path, ref: branch})).data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            const data = {
              checkedAt: new Date().toISOString(), sourceCommit: context.sha,
              url: process.env.GOVERNOR_SITE_URL || null,
              deployment: process.env.GOVERNOR_DEPLOYMENT || 'not-started',
              websiteCheck: process.env.GOVERNOR_LIVECHECK || 'not-started',
              eligible: process.env.GOVERNOR_ELIGIBLE === 'true',
              blockedReason: process.env.GOVERNOR_BLOCKED || null,
              existingUrl: process.env.GOVERNOR_EXISTING_URL || null,
              runUrl: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              note: 'Only the app shell is hosted. Personal cloud sync requires the owner account setup.'
            };
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch,
              message: 'Record Governor website publication outcome',
              content: Buffer.from(JSON.stringify(data, null, 2) + '\n').toString('base64'),
              ...(sha ? {sha} : {})});
